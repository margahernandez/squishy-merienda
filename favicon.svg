<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="side" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9C5E1B"/>
      <stop offset="0.3" stop-color="#E2A848"/>
      <stop offset="0.55" stop-color="#F0BE5E"/>
      <stop offset="1" stop-color="#A7651E"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A1A05" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="top" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#EE9A3C"/>
      <stop offset="0.6" stop-color="#D0702A"/>
      <stop offset="1" stop-color="#A9501A"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6E2E08"/>
      <stop offset="1" stop-color="#8E4512"/>
    </radialGradient>
  </defs>
  <!-- jeepney signboard: black plate with a stainless keyline -->
  <rect width="64" height="64" rx="14" fill="#0C0B0A"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="12.5" fill="none" stroke="#737A81" stroke-width="1.5"/>
  <!-- caramel pooled on the plate -->
  <ellipse cx="32" cy="42.5" rx="26" ry="10.5" fill="url(#pool)"/>
  <!-- the custard's side wall, with caramel running down it -->
  <path d="M12.5,27 L9.5,40 A22.5,9.6 0 0 0 54.5,40 L51.5,27 Z" fill="url(#side)"/>
  <path d="M12.5,27 L9.5,40 A22.5,9.6 0 0 0 54.5,40 L51.5,27 Z" fill="url(#shade)"/>
  <g fill="#B5621F" opacity="0.75">
    <path d="M20,32 q1.2,5 0.4,10 l2.4,0.6 q0.4,-5 -0.6,-10.3 z"/>
    <path d="M37,33.5 q1,4.4 0.2,9.3 l2.2,0.2 q0.5,-4.8 -0.5,-9.6 z"/>
    <path d="M46.5,31.5 q0.8,3.4 0.1,7.4 l1.9,-0.3 q0.3,-3.6 -0.5,-7.3 z"/>
  </g>
  <!-- glossy caramel top -->
  <ellipse cx="32" cy="27" rx="19.5" ry="8.6" fill="url(#top)"/>
  <ellipse cx="32" cy="27" rx="19.5" ry="8.6" fill="none" stroke="#F6B866" stroke-width="0.9" opacity="0.7"/>
  <path d="M18.5,26.5 C20,22.6 27,20.8 33,21.1" fill="none" stroke="#FFE7C2" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="40" cy="24.2" rx="2.6" ry="0.9" fill="#FFE2B8" opacity="0.6"/>
</svg>
